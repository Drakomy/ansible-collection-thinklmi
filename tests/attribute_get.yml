---
- name: Test attribute_get module
  hosts: all
  gather_facts: false
  tasks:
    - name: Read after power loss property
      drakomy.thinklmi.attribute_get:
        component: 'After Power Loss'
        property: current_value

    - name: Read alarm date property
      drakomy.thinklmi.attribute_get:
        component: 'AlarmDate(MM\DD\YYYY)'
        property: type

    - name: Read intel manageability control property
      drakomy.thinklmi.attribute_get:
        component: 'Intel(R) Manageability Control'
        property: possible_values

    - name: Read usb port 4 property
      drakomy.thinklmi.attribute_get:
        component: 'USB Port 4'
        property: current_value

    - name: Read usb port 8 property
      drakomy.thinklmi.attribute_get:
        component: 'USB Port 8'
        property: current_value
      ignore_errors: true
